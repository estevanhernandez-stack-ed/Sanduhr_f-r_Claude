# docs/mac-smoke-test.md section 4: every Settings section opens in the one window. Item 68
# (section 33): each section that controls something visible shows its preview card, snapped.
name: Every Settings section opens
steps:
  - do: settings
    arg: general
  - expect_state: { settings_open: true, settings_section: general, settings_preview: menuBar }
  - snap: preview-general
  - do: settings
    arg: alerts
  - expect_state: { settings_section: alerts, settings_preview: null }
  - do: settings
    arg: credentials
  # Item 36: the section kept its raw value and is now the Accounts page. Its caption names the
  # session key with or without accounts. Nothing here adds, removes, switches or signs out an
  # account; no smoke or debug action can add, remove or sign out one.
  - expect_state: { settings_section: credentials }
  - expect:
      window: settings
      contains: { text: "/(own|Paste the) session key/" }
  - do: settings
    arg: usage
  # Item 48: Claude Usage sits under Accounts.
  - expect_state: { settings_section: usage, usage_page.open: true }
  - do: settings
    arg: integrations
  # Item 49: install and remove happen only by hand on a test folder (docs/mac-smoke-test.md);
  # the page opening installs nothing. Item 68: its statusline preview always runs on sample
  # input, so its card always carries the Sample label.
  - expect_state: { settings_section: integrations, settings_preview: integrations }
  - expect:
      window: settings
      contains: { text: "/MCP server/" }
  - expect:
      window: settings
      contains: { text: "/Sample/" }
  - snap: preview-integrations
  - do: settings
    arg: mods
  # Item 64: the Mods page only reads (no switch, no edit); its summary card counts real mods,
  # so it never carries the Sample label. Settings v2, slice 1: Sanduhr's own mod opens the page and
  # the "Mods and plugins" heading sits right above the list, below it.
  - expect_state: { settings_section: mods, settings_preview: mods, mods_page.open: true }
  - expect:
      window: settings
      contains: { text: "/Sanduhr.s mod/" }
  - snap: preview-mods
  - do: settings
    arg: deskLayout
  - expect_state: { settings_section: deskLayout, settings_preview: layout }
  - snap: preview-layout
  - do: settings
    arg: deskLook
  - expect_state: { settings_section: deskLook, settings_preview: look }
  - snap: preview-look
  - do: settings
    arg: deskMeters
  - expect_state: { settings_section: deskMeters, settings_preview: meters }
  - snap: preview-meters
  - do: settings
    arg: message
  - expect_state: { settings_section: message, settings_preview: message }
  - snap: preview-message
  - do: settings
    arg: notch
  - expect_state: { settings_section: notch, settings_preview: notch }
  - expect:
      window: settings
      contains: { text: Test Glow }
  - snap: preview-notch
  - do: settings
    arg: nowPlaying
  - expect_state: { settings_section: nowPlaying, settings_preview: nowPlaying }
  - snap: preview-now-playing
  - do: settings
    arg: widgetLook
  - expect_state: { settings_section: widgetLook, settings_preview: widget }
  - snap: preview-widget-look
  - do: settings
    arg: themes
  - expect_state: { settings_section: themes, settings_preview: null }
  - do: settings
    arg: pacing
  - expect_state: { settings_section: pacing, settings_preview: widget }
  - expect:
      window: settings
      contains: { text: Pacing & Focus }
  - snap: last-section
  - do: settings
    arg: updates
  - expect_state: { settings_section: updates }
  - expect:
      window: settings
      contains: { text: "/Check for Updates/" }
  - do: settings
    arg: about
  - expect_state: { settings_section: about }
  - expect:
      window: settings
      contains: { text: "/Not affiliated with Anthropic/" }
  - snap: about
