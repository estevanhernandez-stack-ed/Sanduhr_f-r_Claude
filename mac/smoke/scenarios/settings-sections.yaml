# docs/mac-smoke-test.md section 4: every Settings section opens in the one window.
name: Every Settings section opens
steps:
  - do: settings
    arg: general
  - expect_state: { settings_open: true, settings_section: general }
  - do: settings
    arg: alerts
  - expect_state: { settings_section: alerts }
  - do: settings
    arg: credentials
  # Item 36: the section kept its raw value and is now the Accounts page. Its caption names the
  # session key with or without accounts. Nothing here adds, removes, switches or signs out an
  # account; no smoke or debug action can add, remove or sign out one.
  - expect_state: { settings_section: credentials }
  - expect:
      window: settings
      contains: { text: "/(own|Paste the) session key/" }
  - do: settings
    arg: deskLayout
  - expect_state: { settings_section: deskLayout }
  - do: settings
    arg: deskLook
  - expect_state: { settings_section: deskLook }
  - do: settings
    arg: deskMeters
  - expect_state: { settings_section: deskMeters }
  - do: settings
    arg: message
  - expect_state: { settings_section: message }
  - do: settings
    arg: notch
  - expect_state: { settings_section: notch }
  - do: settings
    arg: widgetLook
  - expect_state: { settings_section: widgetLook }
  - do: settings
    arg: themes
  - expect_state: { settings_section: themes }
  - do: settings
    arg: pacing
  - expect_state: { settings_section: pacing }
  - expect:
      window: settings
      contains: { text: Pacing & Focus }
  - snap: last-section
  - do: settings
    arg: updates
  - expect_state: { settings_section: updates }
  - expect:
      window: settings
      contains: { text: Check Now }
  - do: settings
    arg: about
  - expect_state: { settings_section: about }
  - expect:
      window: settings
      contains: { text: "/Not affiliated with Anthropic/" }
  - snap: about
