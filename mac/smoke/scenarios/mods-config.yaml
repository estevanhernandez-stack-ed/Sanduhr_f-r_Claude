# Item 71, slice 1: Mods & Config opens on Catalog | By Folder. The Catalog lists every extension
# any Claude Code folder holds or any marketplace it added lists, one card each with a chip per
# folder; By Folder shows each folder (the page says "folder" since 2026-10-17; the hook and the
# state keys still say `seat`). state.yaml's `mods_config` carries the tab and counts only, never
# a name, label, path or value. Read only: the run switches tabs and demo mode (in memory) and nothing else; no seat
# file changes (the tests prove the scan writes nothing; by hand, docs/mac-smoke-test.md,
# sections 49 and 50).
name: Mods & Config Catalog and By Folder
steps:
  # Demo mode first, so the snaps show no work seat, its sources or its descriptions.
  - do: demo
    arg: "on"
  - do: mods-config
    arg: catalog
  - expect_state:
      settings_section: mods
      mods_page.open: true
      mods_config.tab: catalog
      mods_config.seats: '/^\d+$/'
      mods_config.cards: '/^[1-9]\d*$/'
      mods_config.shown: '/^[1-9]\d*$/'
  - expect:
      window: settings
      contains: { text: "/in the catalog|shown\\./" }
  # One word per concept (2026-10-17): the tab and the filter say folder, never seat.
  - expect:
      window: settings
      contains: { text: By Folder }
  - expect:
      window: settings
      missing: { text: "/By Seat|All seats/" }
  - snap: mods-catalog
  - do: mods-config
    arg: seat
  - expect_state: { mods_config.tab: seat }
  - snap: mods-by-seat
  # By Folder (slice 1b): the picker on the first folder, its eight sections' counts in
  # `mods_config.by_seat`, numbers and flags only. Opening a folder reads files, changes none.
  - do: mods-config
    arg: seat 1
  - expect_state:
      mods_config.tab: seat
      mods_config.selected: 1
      mods_config.by_seat.0.settings: '/^\d+$/'
      mods_config.by_seat.0.unreadable: '/^(true|false)$/'
      mods_config.by_seat.0.history_warning: '/^(true|false)$/'
  - expect:
      window: settings
      contains: { text: Drift between folders }
  - expect:
      window: settings
      missing: { text: "/Drift between seats|Extensions/" }
  - snap: mods-by-seat-1
  - do: mods-config
    arg: catalog
  - expect_state: { mods_config.tab: catalog }
  - do: demo
    arg: "off"
