# docs/mac-smoke-test.md section 28: What's New (item 57) opens from its hook as About and the
# menus open it, shows its cards, and closes. Records nothing: whatsNewLastSeen stays as it was.
name: What's New window
steps:
  - do: whats-new
  - expect_state: { whats_new.open: true }
  - expect:
      window: whats-new
      contains: { text: "/What.s New in Sanduhr/" }
  - expect:
      window: whats-new
      contains: { text: Show me }
  - expect:
      window: whats-new
      contains: { text: "/Don.t show after updates/" }
  - snap: whats-new
  - do: close-whats-new
  - expect_state: { whats_new.open: false }
