# Iteration 3 item 21: the notch island glows for Sanduhr's events. The glow action fires it
# whatever the Glow switches say; the count only ever goes up, so this checks it is above 0.
# The glow lasts about three seconds: watch the snap for a soft halo in the notch ink down the
# island's sides and along its bottom (none along the top, where the screen edge and the camera
# housing would break it up), with the island and its text untouched. The run puts the
# notch switch back.
name: Notch glow on demand
needs: [desk, notch]
steps:
  - expect_state: { glow_alerts: "/^(true|false)$/", glow_meetings: "/^(true|false)$/", glow_camera: "/^(true|false)$/" }
  - do: notch
    arg: "on"
  - expect_state: { notch: true, has_notch: true }
  - do: glow
    arg: alert
  - expect_state: { glow_count: "/^[1-9]/" }
  # Checked straight away: the glow is gone about three seconds after it fires.
  - expect:
      window: glow
      contains: { label: Notch glow }
      within: 2
  - snap: notch-glow
