# Item 72, slice 4 (F22): demo mode fills every surface with sample data. Meant for a fresh
# profile (a scratch macOS user, nothing signed in): `demo on` still puts sample meters on the
# widget, the Desk's Claude meters and Claude line, the notch's Claude meters and Settings, Usage,
# and two sample accounts on the widget's chip and Settings, Accounts. Held in memory: nothing is
# written, no account is added, and `demo off` (or the restore) brings the real state back. Also
# safe on a signed-in profile, where demo mode covers the real numbers until off.
# By hand: docs/mac-smoke-test.md, section 48, "Signed out and demo mode".
name: Demo mode fills every surface
needs: [desk]
steps:
  - do: show-widget
  - do: demo
    arg: "on"
  - expect_state:
      demo.active: true
      demo.widget_tiers: '/^[1-9]\d*$/'
      demo.desk_line: true
      demo.notch_meters: true
      demo.accounts: 2
      meters.0.percent: '/^\d+$/'
  - expect:
      window: widget
      contains: { text: "/Work/" }
  - do: usage
    arg: meters
  - expect_state: { usage_page.open: true, usage_page.tab: meters, demo.usage_rows: '/^[1-9]\d*$/' }
  - do: settings
    arg: credentials
  - expect:
      window: settings
      contains: { text: "/Personal/" }
  - snap: demo-every-surface
  - do: demo
    arg: "off"
  - expect_state: { demo.active: false }
