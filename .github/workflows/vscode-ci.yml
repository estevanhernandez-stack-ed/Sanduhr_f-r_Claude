name: VS Code extension CI

on:
  push:
    paths:
      - "vscode/**"
      - ".github/workflows/vscode-ci.yml"
  pull_request:
    paths:
      - "vscode/**"
      - ".github/workflows/vscode-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: vscode

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Public-repo check
        run: node scripts/check-public.mjs
      - name: Package
        run: npx @vscode/vsce@4.0.0 package --no-dependencies
